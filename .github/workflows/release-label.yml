name: release-label
# Label events on the release PR (#445, docs/ops/releases.md). Runs only on
# label changes, so it adds nothing to normal PRs or the merge queue.
# - approve: `release-ok` added records a `release-ok` commit status on the
#   head it was added on; release-cadence arms only a head with that status.
# - dequeue: `release-hold` added, or `release-ok` removed, takes a queued
#   release PR out of the merge queue.
# No concurrency group: a later label event must never cancel either job.
on:
  pull_request:
    types: [labeled, unlabeled]
permissions: {}
jobs:
  approve:
    if: ${{ github.event.action == 'labeled' && github.event.label.name == 'release-ok' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: approve
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types scripts/ci/release-label.ts approve --repo "$GITHUB_REPOSITORY" --pr "$PR" --sha "$SHA"
  dequeue:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && ((github.event.action == 'labeled' && github.event.label.name == 'release-hold') || (github.event.action == 'unlabeled' && github.event.label.name == 'release-ok')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: dequeue
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node --experimental-strip-types scripts/ci/release-label.ts dequeue --repo "$GITHUB_REPOSITORY" --pr "$PR"
